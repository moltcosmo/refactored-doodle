function printSalesOrderReport(id){const o=JSON.parse(bridge().getSalesOrder(id));if(!o.sales_order_id){toast('Sales Order tidak ditemukan');return}const projects=parse(bridge().listProjects(id,'',100,0));const payments=parse(bridge().listPayments(id));const projectRows=projects.map(p=>`<tr><td>${esc(p.project_number)}</td><td>${esc(p.name)}</td><td>${Number(p.quantity).toLocaleString('id-ID')} ${esc(p.unit)}</td><td>${esc(p.status)}</td><td class="right">${money(p.sale_amount)}</td></tr>`).join('');const paymentRows=payments.map(x=>`<tr><td>${new Date(x.paid_at).toLocaleString('id-ID')}</td><td>${esc(x.method)}</td><td>${esc(x.reference||'-')}</td><td>${esc(x.status)}</td><td class="right">${money(x.amount)}</td></tr>`).join('');const body=`<div class="grid"><div class="box"><div class="label">Customer</div><div class="value">${esc(o.customer_name)}</div><div class="muted">${esc(o.customer_phone||'')}</div></div><div class="box"><div class="label">Tanggal Order</div><div class="value">${esc(o.order_date)}</div></div><div class="box"><div class="label">Nilai Order</div><div class="value">${money(o.total_amount)}</div></div><div class="box"><div class="label">Status Order</div><div class="value">${esc(o.status)}</div></div></div><div class="section"><h2>Daftar Project</h2>${projectRows?`<table><thead><tr><th>Nomor</th><th>Pekerjaan</th><th>Jumlah</th><th>Status</th><th class="right">Nilai</th></tr></thead><tbody>${projectRows}</tbody></table>`:'<p class="muted">Belum ada Project.</p>'}</div><div class="section"><h2>Riwayat pembayaran</h2>${paymentRows?`<table><thead><tr><th>Tanggal</th><th>Metode</th><th>Referensi</th><th>Status</th><th class="right">Jumlah</th></tr></thead><tbody>${paymentRows}</tbody></table>`:'<p class="muted">Belum ada pembayaran.</p>'}</div><div class="section"><div class="grid"><div class="box"><div class="label">Total dibayar</div><div class="value">${money(o.total_paid)}</div></div><div class="box"><div class="label">Sisa pembayaran</div><div class="value">${money(o.balance)}</div></div></div></div><div class="section"><h2>Catatan Order</h2><div class="note">${esc(o.notes||'-')}</div></div>`;bridge().printHtml('Laporan Order '+o.order_number,pdfShell('Laporan Sales Order',o.order_number+' · '+o.customer_name,body))}

function exportBackup(){
 $('main').innerHTML=`<div class="pagehead"><div><button class="link" onclick="go('more')">← More</button><div class="eyebrow">Data & portabilitas</div><h1>Export & Backup</h1><p class="sub">Keluarkan data untuk diolah, atau simpan seluruh database untuk dipindahkan dan dipulihkan.</p></div></div>
 <div class="sectiontitle"><h2>Export data (CSV)</h2></div>
 <div class="card"><div class="field"><label>Data yang akan diexport</label><select id="export-dataset"><option value="customers">Customers</option><option value="sales_orders">Sales Orders — ringkasan nilai & pembayaran</option><option value="projects">Projects</option><option value="payments">Payments</option><option value="purchases">Purchasing — item per baris</option><option value="suppliers">Suppliers</option><option value="workflow_templates">Workflow templates & tahapan</option><option value="project_stages">Tahapan produksi per Project</option><option value="cost_components">Master komponen biaya</option><option value="project_cost_templates">Project Cost Templates</option><option value="project_hpp">HPP Project — rincian biaya</option><option value="layout_calculations">Paper Layout — hasil per pola</option></select></div><p class="itemmeta">CSV dapat dibuka di Excel atau Google Sheets. Kolom tanggal/waktu diexport sebagai tanggal dan jam lokal; kolom tanggal tanpa jam tetap seperti aslinya. Export mengambil seluruh data pada kategori terpilih, bukan hanya data yang sedang terlihat di layar.</p><button class="btn" style="width:100%" onclick="runCsvExport()">⇩ Export CSV</button></div>
 <div class="sectiontitle"><h2>PDF report & instruksi produksi</h2></div>
 <div class="card"><div class="field"><label>Pilih Project</label><select id="pdf-project">${parse(bridge().listProjects(0,'',100,0)).map(p=>`<option value="${p.id}">${esc(p.project_number)} — ${esc(p.name)}</option>`).join('')}</select></div><div class="toolbar"><button class="btn secondary" onclick="printProductionSheet(Number($('pdf-project').value))">Instruksi Produksi</button><button class="btn ghost" onclick="printProjectReport(Number($('pdf-project').value))">Laporan Project</button></div><p class="itemmeta">Instruksi produksi tidak menampilkan harga jual atau HPP. Laporan Project memuat nilai jual, rincian HPP, dan ringkasan workflow. PDF dibuat melalui menu cetak Android; pilih “Save as PDF” untuk menyimpan file.</p></div>
 <div class="sectiontitle"><h2>Backup database</h2></div>
 <div class="card"><p class="itemmeta">Backup berisi seluruh database aplikasi: customer, order, project, pembayaran, workflow, HPP, layout, supplier, dan pembelian. Simpan file backup di tempat aman, terpisah dari HP.</p><button class="btn" style="width:100%" onclick="runDatabaseBackup()">Simpan backup database</button></div>
 <div class="sectiontitle"><h2>Restore database</h2></div>
 <div class="card"><p class="itemmeta">Restore akan mengganti seluruh data aplikasi saat ini dengan isi file backup. Proses hanya menerima database Print Job Manager yang valid. Sebaiknya buat backup kondisi sekarang sebelum melanjutkan. File backup berisi data usaha dan informasi customer; simpan di tempat yang aman.</p><button class="btn danger" style="width:100%" onclick="runDatabaseRestore()">Pilih file untuk restore</button></div>
 <div class="card" style="margin-top:14px"><b>Catatan</b><p class="itemmeta">Export CSV bukan backup. CSV hanya untuk membaca atau mengolah data; restore penuh harus menggunakan file backup database (.pjmbackup).</p></div>`;
}
function runCsvExport(){const dataset=$('export-dataset').value;const labels={customers:'customers',sales_orders:'sales-orders',projects:'projects',payments:'payments',purchases:'purchases',suppliers:'suppliers',workflow_templates:'workflow-templates',project_stages:'project-stages',cost_components:'hpp-components',project_hpp:'project-hpp',layout_calculations:'paper-layout'};const csv=bridge().exportCsv(dataset);if(!csv){toast('Export tidak tersedia untuk kategori ini');return}bridge().saveTextFile('PJM-'+labels[dataset]+'-'+today()+'.csv','text/csv',csv)}
function runDatabaseBackup(){if(!confirm('Buat file backup seluruh database Print Job Manager?'))return;bridge().createDatabaseBackup()}
function runDatabaseRestore(){if(!confirm('Restore akan MENGGANTI seluruh data aplikasi saat ini. Lanjutkan memilih file backup?'))return;bridge().chooseBackupToRestore()}
window.onNativeFileResult=function(result){toast(result&&result.message?result.message:(result&&result.ok?'Selesai':'Operasi gagal'))};

// Display initial screen and handle native bridge errors gracefully.
render();
</script>
</body></html>
